[package]
name = "kiro-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kiro_monitor"
path = "src/lib.rs"

[[bin]]
name = "kiro-monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.14"
